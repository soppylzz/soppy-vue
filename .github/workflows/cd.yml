name: cd

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  test:
    name: coverage & publish verification
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Prepare puppeteer and playwright
        run: |
          node node_modules/puppeteer/install.mjs
          pnpm exec playwright install chromium

      - name: Verify against publish bundles
        run: pnpm run test:publish

      - name: Build docs
        run: pnpm run tutorial:build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: tutorials/.vitepress/dist

  docs:
    name: publish site
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event.workflow_run.conclusion == 'success'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  lib:
    name: release npm packages
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install

      - name: Build npm packages
        run: pnpm run build:prod

      - name: Version / publish via changesets
        uses: changesets/action@v1
        with:
          title: "Changesets"
          commit: "chore: version packages [changesets]"
          version: pnpm run version # consume add changesets, send an auto PR
          publish: pnpm run release # release and tag
          commitMode: "github-api"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
